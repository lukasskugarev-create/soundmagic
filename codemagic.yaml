workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Append signing overrides to xcconfig
        script: |
          echo "" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY=" >> ios/Flutter/Release.xcconfig
          echo "DEVELOPMENT_TEAM=" >> ios/Flutter/Release.xcconfig
          echo "" >> ios/Flutter/Debug.xcconfig
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Debug.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Debug.xcconfig
          echo "CODE_SIGN_IDENTITY=" >> ios/Flutter/Debug.xcconfig
          echo "DEVELOPMENT_TEAM=" >> ios/Flutter/Debug.xcconfig
          cat ios/Flutter/Release.xcconfig
      - name: Build iOS
        script: flutter build ios --release --no-codesign
      - name: Create IPA
        script: |
          APP_PATH=$(find build/ios/iphoneos -name "*.app" | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r app.ipa Payload/
    artifacts:
      - app.ipa