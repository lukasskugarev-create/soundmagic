workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Prepare Flutter kernel
        script: |
          flutter build ios --release --no-codesign 2>&1 | head -50 || true
          # Ensure Flutter artifacts are generated
          flutter build bundle
      - name: Build with xcodebuild directly
        script: |
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            FLUTTER_BUILD_MODE=release \
            -derivedDataPath ../build/ios_build \
            build
      - name: Create IPA
        script: |
          APP_PATH=$(find build/ios_build -name "Runner.app" -type d | head -1)
          echo "App path: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r app.ipa Payload/
    artifacts:
      - app.ipa